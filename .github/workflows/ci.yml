name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: guber45/ballagan-telecom-api

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linters
        run: |
          pip install black flake8 yamllint ansible ansible-lint

      - name: Black check
        run: black --check src tests

      - name: Flake8
        run: flake8 src tests

      - name: Yamllint
        run: yamllint ansible k3s .github

      - name: Ansible lint
        run: |
          cd ansible
          ANSIBLE_CONFIG=ansible.cfg ansible-lint playbooks roles

      - name: Makefile dry-run
        run: |
          make help
          make -n up
          make -n canary 50

  security:
    name: Trivy IaC scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Trivy
        uses: aquasecurity/setup-trivy@820a56d6b2d74c742cd7f95917750e3f1d0b8b6a
        with:
          version: v0.75.0
          cache: true

      - name: Trivy config scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-iac-results.sarif
          exit-code: "1"
          severity: HIGH,CRITICAL
          hide-progress: true
          skip-setup-trivy: true
          trivyignores: .trivyignore

      - name: Upload IaC scan results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-iac-results.sarif
          category: trivy-iac

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: pip install .

      - name: Run pytest
        run: pytest -v

  docker:
    name: Build, scan and push
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v5

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build, export and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }}
          outputs: type=docker,dest=/tmp/image.tar
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Setup Trivy CLI
        uses: aquasecurity/setup-trivy@v0.3.0
        with:
          version: v0.74.0
          cache: true

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: image
          input: /tmp/image.tar
          format: sarif
          output: trivy-image-results.sarif
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          limit-severities-for-sarif: true
          skip-setup-trivy: true
          trivyignores: .trivyignore

      - name: Upload image scan results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-image-results.sarif
          category: trivy-image
