---
- name: Добавить репозиторий prometheus-community
  ansible.builtin.command: helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
  delegate_to: localhost
  run_once: true
  changed_when: false
  become: false

- name: Обновить репозитории Helm
  ansible.builtin.command: helm repo update
  delegate_to: localhost
  run_once: true
  changed_when: false
  become: false

- name: Проверить наличие запечатанного секрета мониторинга
  ansible.builtin.stat:
    path: "{{ monitoring_sealed_secret_path }}"
  delegate_to: localhost
  run_once: true
  become: false
  register: monitoring_secret_stat

- name: Секрет мониторинга не найден
  ansible.builtin.fail:
    msg: >
      Файл {{ monitoring_sealed_secret_path }} не найден.
      Запечатайте секрет monitoring-secrets (ключи admin-user, admin-password)
      командой kubeseal --cert cert.pem --format yaml < plaintext.yaml > monitoring-sealed-secret.yaml.
      Инструкция: см. раздел «Мониторинг» в README.
  when: not monitoring_secret_stat.stat.exists
  run_once: true

- name: Применить запечатанный секрет мониторинга
  ansible.builtin.command: >
    kubectl apply -f "{{ monitoring_sealed_secret_path }}"
  environment:
    KUBECONFIG: "{{ playbook_dir }}/../../kubeconfig"
  delegate_to: localhost
  run_once: true
  changed_when: true
  become: false

- name: Проверить наличие запечатанного секрета Alertmanager
  ansible.builtin.stat:
    path: "{{ monitoring_alertmanager_secret_path }}"
  delegate_to: localhost
  run_once: true
  become: false
  register: monitoring_alertmanager_secret_stat

- name: Секрет Alertmanager не найден
  ansible.builtin.fail:
    msg: >
      Файл {{ monitoring_alertmanager_secret_path }} не найден.
      Запечатайте секрет alertmanager-telegram-secret (ключ alertmanager.yaml)
      командой kubeseal --cert cert.pem --format yaml < plaintext.yaml > alertmanager-telegram-sealed-secret.yaml.
      Инструкция: см. раздел «Алертинг в Telegram» в README.
  when: not monitoring_alertmanager_secret_stat.stat.exists
  run_once: true

- name: Применить запечатанный секрет Alertmanager
  ansible.builtin.command: >
    kubectl apply -f "{{ monitoring_alertmanager_secret_path }}"
  environment:
    KUBECONFIG: "{{ playbook_dir }}/../../kubeconfig"
  delegate_to: localhost
  run_once: true
  changed_when: true
  become: false

- name: Установить kube-prometheus-stack
  ansible.builtin.command: >
    helm upgrade --install kube-prometheus-stack prometheus-community/kube-prometheus-stack
    --namespace {{ monitoring_namespace }}
    --create-namespace
    --version {{ monitoring_chart_version }}
    --values "{{ monitoring_values_path }}"
  environment:
    KUBECONFIG: "{{ playbook_dir }}/../../kubeconfig"
  delegate_to: localhost
  run_once: true
  changed_when: true
  become: false

- name: Ждать готовности оператора Prometheus
  ansible.builtin.command: >
    kubectl wait --namespace {{ monitoring_namespace }}
    --for=condition=ready pod
    --selector=app.kubernetes.io/name=prometheus-operator
    --timeout=120s
  environment:
    KUBECONFIG: "{{ playbook_dir }}/../../kubeconfig"
  delegate_to: localhost
  run_once: true
  changed_when: false
  become: false

- name: Ждать готовности Grafana
  ansible.builtin.command: >
    kubectl wait --namespace {{ monitoring_namespace }}
    --for=condition=ready pod
    --selector=app.kubernetes.io/name=grafana
    --timeout=180s
  environment:
    KUBECONFIG: "{{ playbook_dir }}/../../kubeconfig"
  delegate_to: localhost
  run_once: true
  changed_when: false
  become: false

- name: Ждать готовности Alertmanager
  ansible.builtin.command: >
    kubectl wait --namespace {{ monitoring_namespace }}
    --for=condition=ready pod
    --selector=app.kubernetes.io/name=alertmanager
    --timeout=180s
  environment:
    KUBECONFIG: "{{ playbook_dir }}/../../kubeconfig"
  delegate_to: localhost
  run_once: true
  changed_when: false
  become: false

- name: Применить ServiceMonitor для приложения
  ansible.builtin.command: >
    kubectl apply -f "{{ playbook_dir }}/../../k3s/monitoring/servicemonitor.yaml"
  environment:
    KUBECONFIG: "{{ playbook_dir }}/../../kubeconfig"
  delegate_to: localhost
  run_once: true
  changed_when: true
  become: false

- name: Применить алерт-правило
  ansible.builtin.command: >
    kubectl apply -f "{{ playbook_dir }}/../../k3s/monitoring/prometheusrule.yaml"
  environment:
    KUBECONFIG: "{{ playbook_dir }}/../../kubeconfig"
  delegate_to: localhost
  run_once: true
  changed_when: true
  become: false

- name: Применить SLI-правила и burn-rate алерты
  ansible.builtin.command: >
    kubectl apply -f "{{ playbook_dir }}/../../k3s/monitoring/sli-rules.yaml"
  environment:
    KUBECONFIG: "{{ playbook_dir }}/../../kubeconfig"
  delegate_to: localhost
  run_once: true
  changed_when: true
  become: false

- name: Применить дашборд Grafana
  ansible.builtin.command: >
    kubectl apply -n {{ monitoring_namespace }}
    -f "{{ playbook_dir }}/../../k3s/monitoring/grafana-dashboard-configmap.yaml"
  environment:
    KUBECONFIG: "{{ playbook_dir }}/../../kubeconfig"
  delegate_to: localhost
  run_once: true
  changed_when: true
  become: false
