---
- name: Добавить репозиторий prometheus-community
  kubernetes.core.helm_repository:
    name: prometheus-community
    repo_url: https://prometheus-community.github.io/helm-charts
  delegate_to: localhost
  run_once: true
  become: false

- name: Проверить наличие запечатанного секрета мониторинга
  ansible.builtin.stat:
    path: "{{ monitoring_sealed_secret_path }}"
  delegate_to: localhost
  run_once: true
  become: false
  register: monitoring_secret_stat

- name: Секрет мониторинга не найден
  ansible.builtin.fail:
    msg: >
      Файл {{ monitoring_sealed_secret_path }} не найден.
      Запечатайте секрет monitoring-secrets (ключи admin-user, admin-password)
      командой kubeseal --cert cert.pem --format yaml < plaintext.yaml > monitoring-sealed-secret.yaml.
      Инструкция: см. раздел «Мониторинг» в README.
  when: not monitoring_secret_stat.stat.exists
  run_once: true

- name: Создать пространство имен monitoring
  kubernetes.core.k8s:
    api_version: v1
    kind: Namespace
    name: "{{ monitoring_namespace }}"
    state: present
    kubeconfig: "{{ playbook_dir }}/../../kubeconfig"
  delegate_to: localhost
  run_once: true
  become: false

- name: Применить запечатанный секрет мониторинга
  kubernetes.core.k8s:
    state: present
    src: "{{ monitoring_sealed_secret_path }}"
    kubeconfig: "{{ playbook_dir }}/../../kubeconfig"
  delegate_to: localhost
  run_once: true
  become: false

- name: Проверить наличие запечатанного секрета Alertmanager
  ansible.builtin.stat:
    path: "{{ monitoring_alertmanager_secret_path }}"
  delegate_to: localhost
  run_once: true
  become: false
  register: monitoring_alertmanager_secret_stat

- name: Секрет Alertmanager не найден
  ansible.builtin.fail:
    msg: >
      Файл {{ monitoring_alertmanager_secret_path }} не найден.
      Запечатайте секрет alertmanager-telegram-secret (ключ alertmanager.yaml)
      командой kubeseal --cert cert.pem --format yaml < plaintext.yaml > alertmanager-telegram-sealed-secret.yaml.
      Инструкция: см. раздел «Алертинг в Telegram» в README.
  when: not monitoring_alertmanager_secret_stat.stat.exists
  run_once: true

- name: Применить запечатанный секрет Alertmanager
  kubernetes.core.k8s:
    state: present
    src: "{{ monitoring_alertmanager_secret_path }}"
    kubeconfig: "{{ playbook_dir }}/../../kubeconfig"
  delegate_to: localhost
  run_once: true
  become: false

- name: Установить kube-prometheus-stack
  kubernetes.core.helm:
    name: kube-prometheus-stack
    chart_ref: prometheus-community/kube-prometheus-stack
    release_namespace: "{{ monitoring_namespace }}"
    create_namespace: true
    chart_version: "{{ monitoring_chart_version }}"
    values_files:
      - "{{ monitoring_values_path }}"
    kubeconfig: "{{ playbook_dir }}/../../kubeconfig"
  delegate_to: localhost
  run_once: true
  become: false

- name: Ждать готовности оператора Prometheus
  kubernetes.core.k8s_info:
    kind: Deployment
    name: kube-prometheus-stack-operator
    namespace: "{{ monitoring_namespace }}"
    kubeconfig: "{{ playbook_dir }}/../../kubeconfig"
    wait: true
    wait_condition:
      type: Available
      status: "True"
    wait_timeout: 120
  delegate_to: localhost
  run_once: true
  become: false

- name: Ждать готовности Grafana
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: "{{ monitoring_namespace }}"
    label_selectors:
      - app.kubernetes.io/name=grafana
    kubeconfig: "{{ playbook_dir }}/../../kubeconfig"
    wait: true
    wait_condition:
      type: Ready
      status: "True"
    wait_timeout: 500
  delegate_to: localhost
  run_once: true
  become: false

- name: Ждать готовности Alertmanager
  ansible.builtin.command: >
    kubectl rollout status statefulset alertmanager-kube-prometheus-stack-alertmanager
    --namespace="{{ monitoring_namespace }}"
    --timeout=300s
  environment:
    KUBECONFIG: "{{ playbook_dir }}/../../kubeconfig"
  changed_when: false
  delegate_to: localhost
  run_once: true
  become: false

- name: Применить ServiceMonitor для приложения
  kubernetes.core.k8s:
    state: present
    src: "{{ playbook_dir }}/../../k3s/monitoring/servicemonitor.yaml"
    kubeconfig: "{{ playbook_dir }}/../../kubeconfig"
  delegate_to: localhost
  run_once: true
  become: false

- name: Применить алерт-правило
  kubernetes.core.k8s:
    state: present
    src: "{{ playbook_dir }}/../../k3s/monitoring/prometheusrule.yaml"
    kubeconfig: "{{ playbook_dir }}/../../kubeconfig"
  delegate_to: localhost
  run_once: true
  become: false

- name: Применить SLI-правила и burn-rate алерты
  kubernetes.core.k8s:
    state: present
    src: "{{ playbook_dir }}/../../k3s/monitoring/sli-rules.yaml"
    kubeconfig: "{{ playbook_dir }}/../../kubeconfig"
  delegate_to: localhost
  run_once: true
  become: false

- name: Применить дашборд Grafana
  kubernetes.core.k8s:
    state: present
    src: "{{ playbook_dir }}/../../k3s/monitoring/grafana-dashboard-configmap.yaml"
    kubeconfig: "{{ playbook_dir }}/../../kubeconfig"
  delegate_to: localhost
  run_once: true
  become: false
