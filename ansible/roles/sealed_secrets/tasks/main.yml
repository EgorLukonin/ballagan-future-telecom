---
- name: Проверить наличие мастер-ключа Sealed Secrets
  ansible.builtin.stat:
    path: "{{ sealed_secrets_master_key }}"
  delegate_to: localhost
  run_once: true
  become: false
  register: sealed_secrets_master_key_stat

- name: Мастер-ключ Sealed Secrets не найден
  ansible.builtin.fail:
    msg: >
      Файл {{ sealed_secrets_master_key }} не найден.
      Получите его с кластера, где живёт ключ:
      kubectl get secret -n kube-system sealed-secrets-key -o yaml > master-key.yaml
      и положите по указанному пути (файл в .gitignore),
      либо задайте свой путь: -e sealed_secrets_master_key=/path/to/master-key.yaml
  when: not sealed_secrets_master_key_stat.stat.exists
  run_once: true

- name: Добавить Sealed Secrets
  ansible.builtin.command: >
    helm repo add sealed-secrets https://bitnami.github.io/sealed-secrets
  delegate_to: localhost
  run_once: true
  changed_when: true
  become: false

- name: Обновить репозитории Helm
  ansible.builtin.command: helm repo update
  delegate_to: localhost
  run_once: true
  changed_when: false
  become: false

- name: Импортировать мастер-ключ Sealed Secrets
  ansible.builtin.command: >
    kubectl replace --force -f "{{ playbook_dir }}/../../k3s/sealed-secrets/master-key.yaml"
  environment:
    KUBECONFIG: "{{ playbook_dir }}/../../kubeconfig"
  delegate_to: localhost
  run_once: true
  changed_when: true
  become: false

- name: Установить Sealed Secrets Controller через Helm
  ansible.builtin.command: >
    helm upgrade --install sealed-secrets sealed-secrets/sealed-secrets
    --namespace kube-system
    --create-namespace
  environment:
    KUBECONFIG: "{{ playbook_dir }}/../../kubeconfig"
  delegate_to: localhost
  run_once: true
  changed_when: true
  become: false

- name: Применить запечатанный секрет приложения
  ansible.builtin.command: >
    kubectl apply -f "{{ playbook_dir }}/../../k3s/sealed-secrets/materials-api-sealed-secret.yaml"
  environment:
    KUBECONFIG: "{{ playbook_dir }}/../../kubeconfig"
  delegate_to: localhost
  run_once: true
  changed_when: true
  become: false
