- name: Обновить репозитории Helm
  ansible.builtin.command: helm repo update
  delegate_to: localhost
  run_once: true
  changed_when: false
  become: false

- name: Установить Ingress Nginx Controller
  ansible.builtin.command: >
    helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx
    --namespace {{ ingress_namespace }}
    --create-namespace
    --set controller.service.type=LoadBalancer
  environment:
    KUBECONFIG: "{{ playbook_dir }}/../../kubeconfig"
  delegate_to: localhost
  run_once: true
  changed_when: true
  become: false

- name: Ждать готовности подов
  ansible.builtin.command: >
    kubectl wait --namespace {{ ingress_namespace }}
    --for=condition=ready pod
    --selector=app.kubernetes.io/name=ingress-nginx
    --timeout=90s
  environment:
    KUBECONFIG: "{{ playbook_dir }}/../../kubeconfig"
  delegate_to: localhost
  run_once: true
  become: false
  changed_when: false

- name: Применение чартов
  ansible.builtin.command: >
    helm upgrade --install materials-api "{{ playbook_dir }}/../../k3s/helm-charts/materials-univ-api"
    --namespace default
    --create-namespace
  environment:
    KUBECONFIG: "{{ playbook_dir }}/../../kubeconfig"
  delegate_to: localhost
  run_once: true
  changed_when: true
  become: false

