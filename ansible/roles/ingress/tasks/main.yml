- name: Добавить репозиторий Ingress Nginx
  kubernetes.core.helm_repository:
    name: ingress-nginx
    repo_url: https://kubernetes.github.io/ingress-nginx
  delegate_to: localhost
  run_once: true
  become: false

- name: Обновить репозитории Helm
  kubernetes.core.helm_repository:
    name: ingress-nginx
    repo_url: https://kubernetes.github.io/ingress-nginx
  delegate_to: localhost
  run_once: true
  become: false

- name: Установить Ingress Nginx Controller
  kubernetes.core.helm:
    name: ingress-nginx
    chart_ref: ingress-nginx/ingress-nginx
    release_namespace: "{{ ingress_namespace }}"
    create_namespace: true
    values:
      controller:
        service:
          type: LoadBalancer
    kubeconfig: "{{ playbook_dir }}/../../kubeconfig"
  delegate_to: localhost
  run_once: true
  become: false

- name: Ждать готовности подов
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: "{{ ingress_namespace }}"
    label_selectors:
      - app.kubernetes.io/name=ingress-nginx
    kubeconfig: "{{ playbook_dir }}/../../kubeconfig"
    wait: true
    wait_condition:
      type: Ready
      status: "True"
    wait_timeout: 90
  delegate_to: localhost
  run_once: true
  become: false

- name: Применение чартов
  kubernetes.core.helm:
    name: materials-api
    chart_ref: "{{ playbook_dir }}/../../k3s/helm-charts/materials-univ-api"
    release_namespace: materials-api
    create_namespace: true
    kubeconfig: "{{ playbook_dir }}/../../kubeconfig"
  delegate_to: localhost
  run_once: true
  become: false
