replicaCount: 2

namespace: "materials-api"

image:
  repository: ballagan-telecom-api
  pullPolicy: Never
  tag: "{{ .Chart.AppVersion }}"

primary:
  version: v1
  replicaCount: 1
  tag: "{{ .Chart.AppVersion }}"

canary:
  enabled: true
  version: v2
  replicaCount: 1
  weight: 10
  tag: "canary"


service:
  port: 80
  targetPort: 8000

ingress:
  enabled: true
  className: "nginx"
  host: ""
  path: /
  pathType: Prefix

probes:
  liveness:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 10
  readiness:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 10

resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 64Mi

securityContext:
  pod:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  container:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
    runAsNonRoot: true
    runAsUser: 1000
