replicaCount: 2

image:
  repository: ballagan-telecom-api
  pullPolicy: Never
  tag: "latest"

primary:
  version: v1
  replicaCount: 1
  tag: "latest"

canary:
  enabled: true
  version: v2
  replicaCount: 1
  weight: 10
  tag: "canary"


service:
  port: 80
  targetPort: 8000

ingress:
  enabled: true
  className: "nginx"
  host: ""
  path: /
  pathType: Prefix

probes:
  liveness:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 10
  readiness:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 10

resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 64Mi
