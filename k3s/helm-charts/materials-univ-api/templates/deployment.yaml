apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "materials-api.fullname" . }}-primary
  labels:
    {{- include "materials-api.labels" . | nindent 4 }}
    app: production-api
    version: {{ .Values.primary.version | quote }}
spec:
  replicas: {{ .Values.primary.replicaCount }}
  selector:
    matchLabels:
      {{- include "materials-api.selectorLabels" . | nindent 6 }}
      app: production-api
      version: {{ .Values.primary.version | quote }}
  template:
    metadata:
      labels:
        {{- include "materials-api.selectorLabels" . | nindent 8 }}
        app: production-api
        version: {{ .Values.primary.version | quote }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
            - name: YANDEX_DISK_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: materials-api-secrets
                  key: yandex_disk_public_key

---
{{- if .Values.canary.enabled -}}
