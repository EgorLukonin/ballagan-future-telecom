---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: materials-api-health
  namespace: monitoring
spec:
  groups:
    - name: materials-api
      rules:
        - alert: UniversityMaterialsAPIDown
          expr: up{job=~"default/materials-api/.*"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "API «Учебные материалы» недоступен"
            description: >-
              Экземпляр {{ $labels.pod }} не отвечает на /metrics
              более 2 минут.
        - alert: UniversityMaterialsAPIHighErrorRate
          expr: >-
            sum(rate(http_requests_total{
            job=~"default/materials-api/.*", status=~"5.."}[5m]))
            / clamp_min(sum(rate(http_requests_total{
            job=~"default/materials-api/.*"}[5m])), 1) > 0.05
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Высокая доля ошибок 5xx у API «Учебные материалы»"
            description: >-
              Доля ответов 5xx превышает 5% на протяжении 5 минут
              (текущее значение: {{ $value | humanizePercentage }}).
