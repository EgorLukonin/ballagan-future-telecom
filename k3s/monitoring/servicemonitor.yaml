---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: materials-api
  namespace: materials-api
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: production-api
  namespaceSelector:
    matchNames:
      - materials-api
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
