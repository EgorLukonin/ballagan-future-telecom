---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: materials-api
  namespace: default
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: production-api
  namespaceSelector:
    matchNames:
      - default
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
